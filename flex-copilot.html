<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Layout by copailot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="flex.css">
</head>

<body>

  <div class="container">

    <div class="leftSide"></div>

    <div class="rightSide">

      <div class="topRow">
        <div class="smallCol"></div>
        <div class="smallCol"></div>
        <div class="smallCol"></div>
        <div class="smallCol"></div>
      </div>

      <div class="middleRow">
        <div class="halfStack">
          <div class="halfCol"></div>
          <div class="halfCol"></div>
        </div>
        <div class="midCol"></div>
      </div>

      <div class="bottomRow">
        <div class="bigCol"></div>
        <div class="underCol"></div>
      </div>

    </div>

  </div>

</body>
</html>
