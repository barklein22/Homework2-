<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Layout by copailot </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
    <link rel="stylesheet" href="bootstrap.css">

</head>

<body>

<div class="container-fluid h-100">
  <div class="row h-100">

    <div class="col-12 col-md-2">
      <div class="box h-100"></div>
    </div>

    <div class="col-12 col-md-10 box rightSide">

      <div class="row">
        <div class="col-12 col-md-3">
          <div class="box smallCol inner"></div>
        </div>
        <div class="col-12 col-md-3">
          <div class="box smallCol inner"></div>
        </div>
        <div class="col-12 col-md-3">
          <div class="box smallCol inner"></div>
        </div>
        <div class="col-12 col-md-3">
          <div class="box smallCol inner"></div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-md-6">
          <div class="box halfCol inner"></div>
          <div class="box halfCol inner"></div>
        </div>

        <div class="col-12 col-md-6">
          <div class="box midCol inner"></div>
        </div>
      </div>

      <div class="row last-row">
        <div class="col-12 col-md-8">
          <div class="box bigCol inner"></div>
        </div>
        <div class="col-12 col-md-4">
          <div class="box underCol inner"></div>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
